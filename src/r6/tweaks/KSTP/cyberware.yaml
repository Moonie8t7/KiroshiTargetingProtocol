# Kiroshi Smart Targeting Protocol: cyberware records
#
# Defines "Kiroshi IFF Targeting Coprocessor", a frontal-cortex implant that unlocks the
# smart-gun component classes vanilla weapons ignore. It is also the gate for everything
# the redscript side does (KSTPPolicySystem.IsArmed()).
#
# The implant ships as eleven quality tiers, matching the vanilla cyberware ladder from
# tier 1 to tier 5++. A single-quality implant is unreachable through normal play: it
# never rotates into ripperdoc stock as the player levels, and it offers no upgrade for
# the ripperdoc upgrade panel to sell.
#
# What each tier unlocks is data, carried by the stat group that the tier's gameplay
# logic package points at (stats.yaml, KSTP.Grp_Coprocessor_T1 through T5):
#
#   tier 1   head tracking
#   tier 2   + weak spot
#   tier 3   + breach
#   tier 4   + vehicle
#   tier 5   all classes, and permitted classes lock faster
#
# A plus grade shares its base tier's stat group. Quality.RarePlus is a price and display
# step, not another set of unlocks, which is how the vanilla ladder behaves.
#
# Tier 3 also carries the Intelligence attunement, appended by a separate block lower in
# this file rather than by the stat group. Target-class coverage and that attunement are
# the whole of what the ladder buys: the faction axis runs at every tier (ADR 0009).
#
# Vanilla precedent: Items.KiroshiOpticsFragment1 is cyberware that pushes
# SmartGunTrackLegComponentsModifier onto the held weapon through an
# ApplyStatGroupEffector with applicationTarget: Weapon, gated by
# Prereqs.SmartWeaponHeldPrereq. The same mechanism is reproduced here with four
# component classes instead of one, released across the ladder.
#
# Mechanism, traced through the 2.31 dump:
#   Item_Record.OnEquip -> GameplayLogicPackage_Record.effectors
#     -> gamedataApplyStatGroupEffector_Record (orphans.script:48890)
#     -> ApplyStatGroupEffector.Initialize / ApplyModifierGroup
#        (core/gameplay/effectors/applyStatGroupEffector.script:38-91)
#     -> applicationTarget "Weapon" resolves to
#        ScriptedPuppet.GetActiveWeapon(owner).GetItemData().GetStatsObjectID()
#        (core/gameplay/effector.script:31-38)
#
# The fragment's behavior is reproduced, its record is not. Items.KiroshiOpticsFragment1
# is an ItemType.Prt_Fragment, and 2.0 removed the optics fragment slots that made
# fragments equippable (craftingSystem.script:1836-1840 hides all five recipes), so a
# $base clone of it yields an item with nowhere to go. Frontal cortex is a live 2.x slot
# with three openings, so the implant evicts nothing the player already runs.
#
# ---------------------------------------------------------------------------
# Record names
# ---------------------------------------------------------------------------
#
# The eleven TweakDBIDs the redscript side matches on, and the tier each maps to:
#
#   Items.KSTPKiroshiIFFCoprocessorCommon              tier 1
#   Items.KSTPKiroshiIFFCoprocessorCommonPlus          tier 1+
#   Items.KSTPKiroshiIFFCoprocessorUncommon            tier 2
#   Items.KSTPKiroshiIFFCoprocessorUncommonPlus        tier 2+
#   Items.KSTPKiroshiIFFCoprocessorRare                tier 3
#   Items.KSTPKiroshiIFFCoprocessorRarePlus            tier 3+
#   Items.KSTPKiroshiIFFCoprocessorEpic                tier 4
#   Items.KSTPKiroshiIFFCoprocessorEpicPlus            tier 4+
#   Items.KSTPKiroshiIFFCoprocessorLegendary           tier 5
#   Items.KSTPKiroshiIFFCoprocessorLegendaryPlus       tier 5+
#   Items.KSTPKiroshiIFFCoprocessorLegendaryPlusPlus   tier 5++
#
# Core/Policy.reds pins all eleven literals in KSTP_CyberwareTierOf() (Policy.reds:26-52)
# and they appear nowhere else in script. A TweakDBID literal is a compile-time hash and
# does not require the record to exist, so a name that differs by one character produces
# no diagnostic of any kind: KSTP_CyberwareTier() returns 0 for that tier, IsArmed() stays
# false, and the implant does nothing for whoever is wearing it. Renaming a record here
# means editing the matching line there.
#
# The records are generated from one template with TweakXL's $instances, the form
# ChipwareExpansion uses for its own eleven-tier frontal cortex processors
# (zz_zetatech_neuralProcessor.yaml:10-23). Substitution runs in record names as well as
# in field values, and an integer variable substitutes into a name the same way a string
# does (zz_zetatech_neuralProcessor.yaml:90). $instances is not restricted to item records
# or to $base clones: a shipping mod builds bare gamedataGameplayLogicPackage_Record
# entries from $type under $instances the same way
# (scorpiontank/#_scorpion_zenitex_core_dependency.yaml:1848-1874).
#
# Console grant for testing (CET). Any of the eleven suffixes above works:
#   Game.AddToInventory("Items.KSTPKiroshiIFFCoprocessorLegendaryPlusPlus", 1)
#
# ---------------------------------------------------------------------------
# Display strings
# ---------------------------------------------------------------------------
#
# The two record types below resolve their strings through different natives, so they are
# authored differently. This is not a style inconsistency.
#
# An item record's name goes through GetLocalizedItemNameByCName (orphans.script:20082).
# The native hashes its argument and looks the result up in the on-screen localization
# table; a miss returns an empty string rather than the literal text. A plain scalar there
# renders as a blank name on the card, and neither TweakXL nor the game logs anything.
# The item fields therefore use LocKey tokens, registered from script in
# UI/Localization.reds by way of Codeware. See ADR 0008.
#
# A gameplay logic package's UIData goes through the String-taking GetLocalizedText
# (orphans.script:19622), which does return its input on a miss. Those fields stay plain
# scalars so they keep working when Codeware is absent.
#
# Consequence: these strings are English-only in every locale. That is the cost of not
# shipping an .archive.

# ---------------------------------------------------------------------------
# The gameplay logic package attached on equip
#
# One package per base tier, because `statGroup` is a field of the effector inside the
# package rather than a field of the item. Tier 1+ and tier 1 both equip
# KSTP.PkgTargetingProtocol_T1, so the eleven items resolve to five packages.
# ---------------------------------------------------------------------------

KSTP.PkgTargetingProtocol_UI:
  $type: gamedataGameplayLogicPackageUIData_Record
  iconPath: ''
  # Plain quoted scalars, not TweakXL's l"..." LocKey literal. See the display-string
  # note in the file header.
  #
  # Shared by all five packages, and worded so that it stays true at every tier. The card
  # renders this above an effect list generated from the tier's own stat modifiers, so the
  # per-tier class unlocks are already stated there.
  localizedName: "Smart Targeting Protocol"
  localizedDescription: "Arbitrates smart-weapon component locks by target class and threat profile."
  floatValues: []
  intValues: []
  nameValues: []
  stats: []

KSTP.PkgTargetingProtocol_T$(tier):
  $instances:
    - { tier: 1 }
    - { tier: 2 }
    - { tier: 3 }
    - { tier: 4 }
    - { tier: 5 }
  $type: gamedataGameplayLogicPackage_Record
  stackable: False
  UIData: KSTP.PkgTargetingProtocol_UI
  animationWrapperOverrides: []
  items: []
  statPools: []
  stats: []
  effectors:
    - $type: gamedataApplyStatGroupEffector_Record
      effectorClassName: ApplyStatGroupEffector
      applicationTarget: Weapon
      # Same prereq the vanilla optics fragment uses. Keeps the group off non-smart
      # weapons entirely. Prereq records are TweakDB-only data with no script
      # reference; this one sits in the vanilla prereq roster alongside
      # AnyWeaponHeldPrereq, RangedWeaponHeldPrereq, TechWeaponHeldPrereq and
      # PowerWeaponHeldPrereq (redmodding wiki, "Cheat Sheet: Prereqs"), and the
      # sibling AnyWeaponHeldPrereq is used verbatim by a shipping mod
      # (wannabeEdgerunner.yaml:86).
      prereqRecord: Prereqs.SmartWeaponHeldPrereq
      # Hard rule 4 (restore what you mutate): unequipping the implant removes the
      # group natively, with no bookkeeping in script. This also covers the upgrade
      # path, where the ripperdoc unequips one tier and equips the next.
      removeWithEffector: True
      # The prereq above is itself an item-in-slot watch on AttachmentSlots.WeaponRight, so
      # the group follows every draw, holster and swap on its own. This flag is read only
      # when applicationTarget is Weapon (applyStatGroupEffector.script:42-44), and True
      # registers a second weapon-slot listener over the prereq's: the group lands twice on
      # one draw, and an unlocked class reads 4 where the stat group grants Additive 2
      # (docs/research/experiments.md section 2). Vanilla KiroshiOpticsFragment1 leaves this
      # at its default of false and relies on its prereq the same way.
      reapplyOnWeaponChange: False
      removeAfterActionCall: False
      removeAfterPrereqCheck: False
          # The only field that varies across the five packages. Authored in stats.yaml.
      statGroup: KSTP.Grp_Coprocessor_T$(tier)

# ---------------------------------------------------------------------------
# The item
#
# $base-cloned from Items.AdvancedSubdermalCoProcessor$(quality), the vanilla frontal-cortex
# coprocessor, which carries all eleven quality steps. Only the sixteen fields below are
# declared; everything else is inherited.
#
# It was hand-authored as a full gamedataItem_Record until 19 August 2026, on the reasoning
# that no frontal-cortex item ID could be confirmed against the script dump. Three can be read
# straight off an equipped loadout (AdvancedBioConductors, AdvancedExDisk,
# AdvancedSubdermalCoProcessor), and BlackChrome has shipped $base-cloned cyberware in the
# reference corpus throughout.
#
# The hand-authored version declared seventy-one fields and the implant rendered with no
# rolled stat block: a ripperdoc offers every implant a random per-tier bonus roll, and one of
# those fifty-nine surplus overrides suppressed it. Which one was never identified, because
# the record overrode nearly every field the game has. Declaring less fixed what declaring
# more could not.
#
# The rule this leaves: override only what must differ from the parent. A field written out
# to its apparent default is not neutral, it is an assertion that beats inheritance.
#
# Template variables:
#   quality   the quality suffix. It builds the record name and the Quality.* value, so
#             the eleven names and the eleven quality steps cannot drift apart.
#   next      nextUpgradeItem, the record the ripperdoc upgrade panel sells next. The
#             chain is what walks the player up the ladder; the last tier chains to None.
#   tier      base tier 1 to 5, selecting the gameplay logic package and through it the
#             stat group. A plus grade repeats its base tier's number.
# ---------------------------------------------------------------------------

Items.KSTPKiroshiIFFCoprocessor$(quality):
  $instances:
    - { quality: Common,            next: Items.KSTPKiroshiIFFCoprocessorCommonPlus,      tier: 1 }
    - { quality: CommonPlus,        next: Items.KSTPKiroshiIFFCoprocessorUncommon,        tier: 1 }
    - { quality: Uncommon,          next: Items.KSTPKiroshiIFFCoprocessorUncommonPlus,    tier: 2 }
    - { quality: UncommonPlus,      next: Items.KSTPKiroshiIFFCoprocessorRare,            tier: 2 }
    - { quality: Rare,              next: Items.KSTPKiroshiIFFCoprocessorRarePlus,        tier: 3 }
    - { quality: RarePlus,          next: Items.KSTPKiroshiIFFCoprocessorEpic,            tier: 3 }
    - { quality: Epic,              next: Items.KSTPKiroshiIFFCoprocessorEpicPlus,        tier: 4 }
    - { quality: EpicPlus,          next: Items.KSTPKiroshiIFFCoprocessorLegendary,       tier: 4 }
    - { quality: Legendary,         next: Items.KSTPKiroshiIFFCoprocessorLegendaryPlus,   tier: 5 }
    - { quality: LegendaryPlus,     next: Items.KSTPKiroshiIFFCoprocessorLegendaryPlusPlus, tier: 5 }
    - { quality: LegendaryPlusPlus, next: None,                                           tier: 5 }
  $base: Items.AdvancedSubdermalCoProcessor$(quality)

  # Naming and register.
  #
  # Kiroshi branding on a frontal cortex implant is in-universe. The Kiroshi Group is two
  # companies, Kiroshi Optics and Kiroshi General Cybernetics, and the product line already
  # covers the optical HUD, the Optishield and SmartFrames. A coprocessor that arbitrates
  # the smart link sits with the cybernetics arm rather than the optics arm.
  #
  # One name across all eleven tiers, matching the vanilla ladder: every quality step of
  # the Bioconductor is called "Bioconductor". The quality tier is drawn by the UI from
  # the `quality` field below, so a tier suffix in the name would print twice.
  #
  # localizedDescription carries flavor, not numbers. A vanilla cyberware card shows the
  # description above a separately generated effect list built from the item's stat
  # modifiers, so a description written as mechanics duplicates the panel below it.
  # Register to match, one sentence, third person, in-world:
  #   Mechatronic Core  "Provides information about the weak points of both mass-produced
  #                      and some lesser-known machines."
  #   Camillo RAM Manager  "A mod that manages and optimizes RAM use between your brain and
  #                         your cyberdeck."
  # LocKey tokens, not scalars: see the display-string note in the file header. The keys
  # are defined in UI/Localization.reds and must match it exactly.
  displayName: LocKey#kstp_coprocessor_name
  localizedDescription: LocKey#kstp_coprocessor_flavor
  localizedName: LocKey#kstp_coprocessor_name
  cyberwareType: KSTPTargetingCoprocessor
  # Frontal cortex has no mandatory core implant, so this must not claim to be one.
  quality: Quality.$(quality)

  # The ripperdoc upgrade chain. Each tier names the record one step up; the top tier
  # names None, which is what ends the chain and hides the upgrade button.
  nextUpgradeItem: $(next)
  icon: UIIcon.ItemIcon

  # A bare UIIcon record suffix, never an inline icon block. The inventory resolver reads
  # this field and nothing else: it takes Item_Record.IconPath(), and on a non-empty string
  # returns "UIIcon." + that value (inventoryItemsManager.script:128-142). An inline icon
  # block is not consulted anywhere on that path, and redscript never calls .Icon() on an
  # Item_Record at all; the only three call sites in the 2.31 dump are vehicle records.
  #
  # The built TweakDB agrees: across every vanilla and modded record on this install,
  # Items.*.iconPath appears 1265 times and Items.*.icon zero times.
  #
  # An empty value here is not neutral. It fails IsStringValid, drops through to the native
  # IconsNameResolver.TranslateItemToIconName, and that resolver cannot know a record this
  # mod invented, so the item renders with whatever art the fallback lands on.
  #
  # Names UIIcon.KSTPCoprocessor, declared at the foot of this file, which resolves to the
  # atlas this mod ships. The bare suffix is correct: the resolver prepends "UIIcon.".
  #
  # The nine vanilla frontal cortex icons remain available if the custom atlas is ever
  # dropped; cw_frontalcortex_improvedperception is the closest fit by name.
  iconPath: KSTPCoprocessor

  # No world entity: a frontal-cortex implant has no visual representation, so
  # nothing is spawned or attached.
  statModifiers:
    - Items.ItemArmorToArmor
    - Items.AdvancedFrontalCortexModule_inline0
  variants: [Variants.Humanity6Cost]

  # The cyberware pricing chain, in the order a shipping cyberware mod applies it
  # (ChipwareExpansion zz_zetatech_neuralProcessor.yaml:64-81). Price.BasePrice is the
  # generic item base and prices cyberware far too low; Price.BaseCyberwarePrice is the
  # cyberware-specific base, and the multipliers scale it by quality tier and apply the
  # street cred discount the rest of the roster gets.
  #
  # Nothing in the chain is per-tier. Price.ItemQualityMultiplier reads the item's own
  # quality, so the same five entries price all eleven records and the ladder climbs on its
  # own, the way the vanilla roster does: the Bioconductor runs 841 at tier 1 to 19,150 at
  # tier 5++.
  # Price.PlusTierMultiplier is what separates a plus grade from its base grade.
  # Price.ItemQualityMultiplier reads Quality only, and Quality.RarePlus and Quality.Rare
  # score the same there, so without this record all six plus grades price identically to
  # the tier below them and the ladder stops climbing monotonically. Its position between
  # ItemQualityMultiplier and CyberwareMultiplier is the vanilla order.
  buyPrice:
    - Price.BaseCyberwarePrice
    - Price.ItemQualityMultiplier
    - Price.PlusTierMultiplier
    - Price.CyberwareMultiplier
    - Price.BuyPrice_StreetCred_Discount
  sellPrice:
    - Price.BaseCyberwarePrice
    - Price.ItemQualityMultiplier
    - Price.PlusTierMultiplier
    - Price.CyberwareMultiplier
    - Price.CyberwareSellMultiplier

  tags:
    - Cyberware
    - HideInBackpackUI

  OnEquip:
    - KSTP.PkgTargetingProtocol_T$(tier)

# ---------------------------------------------------------------------------
# Attunement, tier 3 and above
#
# A second block against the same record, narrowed to the seven qualities at base tier 3 or
# higher. TweakXL applies blocks in file order, so !append here adds to the arrays the block
# above established. The vanilla cyberdeck records use this same shape to grant capability
# progressively across the ladder.
#
# Tier 3 is where the vanilla Smart Link starts granting its own bonuses, which is the
# precedent this follows: the lower grades do the job, the upper grades pay a dividend.
#
# The faction axis is deliberately NOT gated this way. It runs at every tier, so the shipped
# defaults (no police, no Trauma Team) hold from the moment the cheapest coprocessor is
# installed. See ADR 0009. The ladder buys target-class coverage and this attunement; it does
# not buy the right to choose who you shoot.
#
# Two halves, and only one of them does anything:
#   OnEquip        Attunements.IntelligenceSmartWeaponDamage grants the real bonus,
#                  +0.1% smart weapon damage per point of Intelligence. Its own UIData
#                  already lists BaseStats.AttunementHelper, which is what promotes the row
#                  to the attribute chip (inventoryItemMods.script:170-173).
#   statModifiers  supplies only the number that chip prints. See the note on the base
#                  record. Authoring the helper without the package above would print a
#                  percentage the item does not actually grant.
#
# Intelligence is the attribute governing smart weapons, so this is the vanilla record
# written for this exact case rather than the generic Attunements.IntelligenceAllDamage.
# ---------------------------------------------------------------------------

Items.KSTPKiroshiIFFCoprocessor$(quality):
  $instances:
    - { quality: Rare }
    - { quality: RarePlus }
    - { quality: Epic }
    - { quality: EpicPlus }
    - { quality: Legendary }
    - { quality: LegendaryPlus }
    - { quality: LegendaryPlusPlus }
  OnEquip:
    - !append Attunements.IntelligenceSmartWeaponDamage
  statModifiers:
    - !append
      $type: gamedataCombinedStatModifier_Record
      opSymbol: '*'
      refObject: Player
      refStat: BaseStats.Intelligence
      value: 0.1
      modifierType: Additive
      statType: BaseStats.AttunementHelper

# ---------------------------------------------------------------------------
# Ripperdoc stock
#
# The five base qualities, at every ripperdoc, gated by the vanilla cyberware availability
# records.
#
# The whole block is a copy of BlackChrome's zVendors.yaml: inline anonymous entries appended
# into itemStock under $instances, gated by LootPrereqs.$(quality)CWLevelAvailabilityAtVendor,
# one record per quality. That is the family the base game uses for cyberware, as against the
# PlayerLevel_Tier_* records which belong to loot and weapons.
#
# Only base qualities are stocked. The six Plus grades are upgrade targets, reached by paying a
# ripperdoc to walk nextUpgradeItem. No mod in the reference corpus stocks a Plus grade.
#
# A warning for anyone changing this. Vendor inventory is generated once per vendor and held
# until that vendor restocks, so an edit here has no visible effect at a clinic the player has
# already opened. Four successive configurations were judged against cached stock during
# development and all four read as no-ops. Test at a ripperdoc never visited in that save, or
# skip 48 in-game hours first.
#
# The implant is deliberately absent from every loot table. Frontal cortex cyberware is bought
# from a ripperdoc or given as a quest reward; it is not found in containers or on bodies, so
# no LootTables entry belongs here. The absence is a decision, not an omission.
#
# The vendor list is every ripperdoc ID in active use across the installed mod corpus,
# rather than IDs guessed from the script dump. Only wat_lch_ripperdoc_01 is confirmable
# against 2.31 scripts (cyberpunk/systems/marketSystem/vendor.script), which is why an
# earlier revision shipped that one alone. Appending to a misspelled vendor creates a
# dead record instead of erroring, so a wrong ID here costs stock at that ripperdoc and
# nothing else.
#
# itemStock is array<foreign_key:VendorItem_Record> (orphans.script:23750, :23862).
# Named records plus !append-once are idempotent, so a TweakXL hot reload cannot stack
# duplicate stock entries. quantity is array<foreign_key:StatModifier_Record>
# (VendorWare_Record, orphans.script:16541); Vendors.Always_Present is vanilla.
# ---------------------------------------------------------------------------

Vendors.$(vendor):
  $instances:
    - { vendor: wat_lch_ripperdoc_01 }
    - { vendor: wat_kab_ripperdoc_01 }
    - { vendor: wat_kab_ripperdoc_02 }
    - { vendor: wat_kab_ripperdoc_03 }
    - { vendor: wat_nid_ripperdoc_01 }
    - { vendor: wbr_jpn_ripperdoc_01 }
    - { vendor: wbr_jpn_ripperdoc_02 }
    - { vendor: wbr_hil_ripdoc_01 }
    - { vendor: hey_spr_ripperdoc_01 }
    - { vendor: cct_dtn_ripdoc_01 }
    - { vendor: std_arr_ripperdoc_01 }
    - { vendor: std_rcr_ripperdoc_01 }
    - { vendor: pac_wwd_ripperdoc_01 }
    - { vendor: bls_ina_se1_ripperdoc_01 }
    - { vendor: bls_ina_se1_ripperdoc_02 }
    - { vendor: cz_stadium_ripperdoc_01 }
    - { vendor: cz_con_ripdoc_01 }
    - { vendor: cz_monument_ripperdoc_farida }
    - { vendor: cz_monument_ripperdoc_anderson }
  itemStock:
    - !append
      $instances:
        - { quality: Common }
        - { quality: Uncommon }
        - { quality: Rare }
        - { quality: Epic }
        - { quality: Legendary }
      generationPrereqs:
        - LootPrereqs.$(quality)CWLevelAvailabilityAtVendor
      item: Items.KSTPKiroshiIFFCoprocessor$(quality)
      quantity:
        - Vendors.Always_Present

# ---------------------------------------------------------------------------
# Item icon
#
# The inventory resolver takes Item_Record.IconPath() and, on a non-empty string, looks up
# "UIIcon." + that value (inventoryItemsManager.script:128-142), which is why the item field
# above carries the bare suffix.
#
# atlasPartName must match the part inside the .inkatlas character for character. A mismatch
# raises nothing: the lookup fails, drops through to the native resolver, and the item renders
# with whatever fallback art that lands on. Both names are verified against the built atlas.
#
# This record is the reason the mod ships an .archive, which ADR 0008 had ruled out. The atlas
# and its texture are built from src\archive\source\KSTP\ in the WolvenKit GUI and packed to
# src\archive\pc\mod\kstp.archive; that step cannot be reproduced by a script.
# ---------------------------------------------------------------------------

UIIcon.KSTPCoprocessor:
  $type: gamedataUIIcon_Record
  atlasResourcePath: base\kstp\icons\kstp_coprocessor.inkatlas
  atlasPartName: kstp_coprocessor
